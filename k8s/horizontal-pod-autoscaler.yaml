apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: unity-ads-metrics-ingestion
  labels:
    app.kubernetes.io/name: unity-ads-metrics-ingestion
    app.kubernetes.io/component: ingestion-api
    app.kubernetes.io/part-of: unity-ads
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: unity-ads-metrics-ingestion
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
